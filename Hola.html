<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT: OMEGA - Full Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00f3ff;   /* Cyan Neon */
            --secondary: #bc13fe; /* Purple Neon */
            --danger: #ff0055;    /* Red Neon */
            --gold: #ffae00;      /* Gold */
            --bg-dark: #050510;
            --card-bg: rgba(15, 20, 35, 0.7);
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }

        /* --- FONDO ANIMADO --- */
        #bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -5;
            filter: brightness(0.4) grayscale(0.3);
        }
        
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -4; pointer-events: none;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            z-index: -3; pointer-events: none;
        }

        /* --- HEADER & CONTROLES --- */
        header {
            text-align: center;
            padding: 40px 20px;
            animation: slideDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--primary);
        }

        .controls-area {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .search-box {
            position: relative; width: 100%; max-width: 500px;
        }

        .search-input {
            width: 100%; padding: 15px 50px;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--secondary);
            border-radius: 30px;
            color: white;
            font-family: 'Orbitron';
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            box-shadow: 0 0 20px var(--secondary);
            background: rgba(0,0,0,0.8);
        }

        .filter-row {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 8px 20px;
            font-family: 'Orbitron';
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .btn:hover, .btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }
        
        .btn-random {
            border-color: var(--gold);
            color: var(--gold);
        }
        .btn-random:hover { background: var(--gold); }

        /* --- GRID --- */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(5px);
        }

        .hero-card:hover {
            transform: translateY(-10px) scale(1.05);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
            z-index: 10;
        }

        .hero-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: 0.4s;
            filter: grayscale(0.4);
        }

        .hero-card:hover img {
            filter: grayscale(0);
        }

        .card-info {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, #000 10%, transparent);
            padding: 20px 10px 10px 10px;
            text-align: center;
        }

        .card-name {
            font-family: 'Orbitron';
            font-size: 1.4rem;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 2px 4px #000;
        }

        .card-role-icon {
            position: absolute; top: 10px; right: 10px;
            background: #000;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 0.8rem;
        }

        /* --- DETALLE --- */
        #detail-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            overflow-y: auto;
            animation: fadeIn 0.3s;
        }

        .detail-content {
            max-width: 1200px; margin: 40px auto;
            display: grid; grid-template-columns: 350px 1fr;
            gap: 40px; padding: 20px;
        }

        .portrait-container {
            position: sticky; top: 20px;
            text-align: center;
        }

        .main-portrait {
            width: 100%; border-radius: 10px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px var(--primary);
            margin-bottom: 15px;
        }

        .sub-portrait {
            width: 100px; height: 100px; object-fit: cover;
            border: 1px solid var(--secondary);
            border-radius: 50%; cursor: pointer;
            transition: 0.3s;
        }
        .sub-portrait:hover { transform: scale(1.1); }

        .data-panel h2 {
            font-family: 'Orbitron'; font-size: 3rem; color: var(--primary); margin: 0;
        }

        .role-badge {
            display: inline-block; padding: 5px 15px;
            background: var(--secondary); color: #fff;
            font-family: 'Orbitron'; font-size: 0.8rem;
            border-radius: 4px; margin-bottom: 20px;
        }

        .lore-text {
            line-height: 1.6; font-size: 1.1rem; color: #ccc;
            border-left: 3px solid var(--danger); padding-left: 15px;
            background: linear-gradient(90deg, rgba(255,0,85,0.1), transparent);
        }

        /* Stats Bars */
        .stat-row { display: flex; align-items: center; margin: 8px 0; }
        .stat-name { width: 100px; font-weight: bold; color: var(--primary); }
        .stat-track { flex: 1; height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
        .stat-fill { height: 100%; width: 0; transition: width 1s ease; }
        .fill-atk { background: var(--danger); }
        .fill-def { background: #00aaff; }
        .fill-mag { background: var(--secondary); }
        .fill-spd { background: var(--gold); }

        /* Skills */
        .skill-box {
            background: rgba(255,255,255,0.05); padding: 15px;
            border: 1px solid #555; margin-top: 20px;
        }
        .skill-title { color: var(--gold); font-family: 'Orbitron'; }

        /* Armas */
        .weapons-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; margin-top: 30px;
        }
        .weapon-item {
            background: rgba(0,0,0,0.6); padding: 15px;
            border: 1px solid #444; border-radius: 8px;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .weapon-item:hover { border-color: var(--primary); background: rgba(0, 243, 255, 0.1); }
        .weapon-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; margin-bottom: 10px; }

        .btn-close {
            position: fixed; top: 20px; right: 20px;
            background: var(--danger); color: white; border: none;
            width: 50px; height: 50px; font-size: 1.5rem;
            clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);
            cursor: pointer; z-index: 200;
        }

        /* Modal Img */
        .img-zoom {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            z-index: 300; justify-content: center; align-items: center;
        }
        .img-zoom img { max-width: 90%; max-height: 90%; border: 2px solid white; }

        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 900px) {
            .detail-content { grid-template-columns: 1fr; }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>

        const audioHover = document.getElementById('sfx-hover');
        const audioSelect = document.getElementById('sfx-select');
        const bgMusic = document.getElementById('bg-music-player');
        
        function playSfx(type) {
            if(type === 'hover') { audioHover.currentTime=0; audioHover.volume=0.2; audioHover.play().catch(()=>{}); }
            if(type === 'select') { audioSelect.currentTime=0; audioSelect.volume=0.4; audioSelect.play().catch(()=>{}); }
        }

        // --- SISTEMA DE PARTÍCULAS ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() * 1) - 0.5;
                this.speedY = (Math.random() * 1) - 0.5;
                this.color = 'rgba(0, 243, 255, 0.5)';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if(this.x > canvas.width) this.x = 0;
                if(this.x < 0) this.x = canvas.width;
                if(this.y > canvas.height) this.y = 0;
                if(this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            for(let i=0; i<80; i++) particlesArray.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            for(let i=0; i<particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // --- LÓGICA DE GRID ---
        const grid = document.getElementById('roster');

        function renderGrid(filtro="", rol="todos") {
            grid.innerHTML = "";
            Object.keys(heroes).forEach(key => {
                const h = heroes[key];
                if(h.nombre.toLowerCase().includes(filtro.toLowerCase()) && (rol==="todos" || h.rol===rol)) {
                    grid.innerHTML += `
                        <div class="hero-card" onclick="abrirDetalle('${key}')" onmouseenter="playSfx('hover')">
                            <div class="card-role-icon"><i class="fas ${h.icon}"></i></div>
                            <img src="${h.img1}" loading="lazy">
                            <div class="card-info">
                                <h3 class="card-name">${h.nombre}</h3>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function filtrarGrid(val) { renderGrid(val, document.querySelector('.btn.active').innerText.toLowerCase().replace(/ .*/,'')); }
        
        function filtrarRol(rol) {
            playSfx('select');
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderGrid(document.querySelector('.search-input').value, rol);
        }

        function seleccionarAleatorio() {
            playSfx('select');
            const keys = Object.keys(heroes);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            abrirDetalle(randomKey);
        }

        // --- DETALLE ---
        function abrirDetalle(key) {
            playSfx('select');
            const h = heroes[key];
            const d = document.getElementById('detail-overlay');
            d.style.display = 'block';

            // Textos
            document.getElementById('d-name').innerText = h.nombre;
            document.getElementById('d-role').innerText = h.rol.toUpperCase();
            document.getElementById('d-desc').innerText = h.desc;
            document.getElementById('d-passive').innerText = h.passive;
            document.getElementById('d-active').innerText = h.active;
            document.getElementById('d-weak').innerText = h.weak;
            
            // Imágenes
            document.getElementById('d-img-main').src = h.img1;
            document.getElementById('d-img-sub').src = h.img2;

            // Animación Barras Stats
            setTimeout(() => {
                document.getElementById('bar-atk').style.width = h.stats.atk + '%';
                document.getElementById('bar-def').style.width = h.stats.def + '%';
                document.getElementById('bar-mag').style.width = h.stats.mag + '%';
                document.getElementById('bar-spd').style.width = h.stats.spd + '%';
            }, 100);

            // Armas
            const wContainer = document.getElementById('d-weapons');
            wContainer.innerHTML = '';
            h.weapons.forEach(w => {
                wContainer.innerHTML += `
                    <div class="weapon-item" onclick="zoomImg('${w.i}')" onmouseenter="playSfx('hover')">
                        <img src="${w.i}">
                        <div style="font-family:'Orbitron'; color:var(--primary); font-size:0.9rem;">${w.n}</div>
                    </div>
                `;
            });

            // Música
            if(h.music) {
                bgMusic.src = h.music;
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => console.log("Audio block"));
            }
        }

        function cerrarDetalle() {
            playSfx('select');
            document.getElementById('detail-overlay').style.display = 'none';
            bgMusic.pause();
            bgMusic.currentTime = 0;
            // Resetear barras
            ['atk','def','mag','spd'].forEach(s => document.getElementById('bar-'+s).style.width = '0%');
        }

        function zoomImg(src) {
            document.getElementById('img-zoom').style.display = 'flex';
            document.getElementById('img-zoom-content').src = src;
        }

        // Inicio
        renderGrid();
    </script>
