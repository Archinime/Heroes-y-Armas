<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROJECT: OMEGA - Ultimate Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --danger: #ff0055;
            --gold: #ffae00;
            --bg-dark: #050510;
            --card-bg: rgba(15, 20, 35, 0.85);
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* --- FONDO ANIMADO --- */
        #bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -5;
            filter: brightness(0.4) grayscale(0.3);
            transition: opacity 0.5s;
        }
        
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -4; pointer-events: none;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
            z-index: -3; pointer-events: none;
        }

        /* --- PANTALLA DE INICIO (Para activar audio) --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: opacity 0.5s;
        }
        .start-btn {
            border: 2px solid var(--primary); color: var(--primary);
            padding: 20px 40px; font-family: 'Orbitron'; font-size: 1.5rem;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 10px var(--primary);
        }

        /* --- HEADER & CONTROLES --- */
        header {
            text-align: center; padding: 30px 20px 10px;
            animation: slideDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem); /* Responsive font size */
            text-transform: uppercase; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .subtitle {
            letter-spacing: 3px; color: var(--primary); 
            font-size: 0.8rem; margin-top: 5px; opacity: 0.8;
        }

        .controls-area {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            margin-bottom: 20px; padding: 0 15px;
            position: sticky; top: 0; z-index: 50;
            background: linear-gradient(to bottom, var(--bg-dark) 0%, rgba(5,5,16,0.95) 80%, transparent 100%);
            padding-top: 10px; padding-bottom: 20px;
        }

        .search-box { position: relative; width: 100%; max-width: 500px; }

        .search-input {
            width: 100%; padding: 12px 45px;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--secondary);
            border-radius: 30px;
            color: white; font-family: 'Orbitron'; font-size: 1rem;
            outline: none; transition: 0.3s;
        }
        .search-input:focus {
            box-shadow: 0 0 15px var(--secondary); border-color: #fff;
            background: rgba(0,0,0,0.9);
        }

        /* Scroll horizontal para botones en móvil */
        .filter-wrapper {
            width: 100%; max-width: 1200px;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch; /* Smooth scroll iOS */
        }
        
        .filter-wrapper::-webkit-scrollbar { height: 4px; }
        .filter-wrapper::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        .filter-row {
            display: flex; gap: 10px; justify-content: center;
            min-width: max-content; /* Fuerza que los botones no se rompan */
            padding: 0 10px;
        }

        .btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            font-family: 'Orbitron'; font-size: 0.85rem;
            cursor: pointer; transition: 0.3s;
            white-space: nowrap; /* Evita texto en dos líneas */
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .btn:hover, .btn.active {
            background: var(--primary); color: #000;
            box-shadow: 0 0 15px var(--primary);
            font-weight: bold;
        }
        
        .btn-random { border-color: var(--gold); color: var(--gold); }
        .btn-random:hover { background: var(--gold); }

        /* --- GRID --- */
        .roster-grid {
            display: grid;
            /* Mejor ajuste automático para móviles y escritorio */
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1400px; margin: 0 auto; padding: 0 15px 80px;
        }

        /* En tablets/PC, cartas más grandes */
        @media (min-width: 600px) {
            .roster-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; overflow: hidden; position: relative;
            cursor: pointer; transition: 0.3s;
            backdrop-filter: blur(5px);
            aspect-ratio: 3/4; /* Mantiene proporción */
        }

        .hero-card:active { transform: scale(0.96); } /* Efecto click en móvil */
        @media (hover: hover) {
            .hero-card:hover {
                transform: translateY(-10px) scale(1.05);
                border-color: var(--primary);
                box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
                z-index: 10;
            }
            .hero-card:hover img { filter: grayscale(0); transform: scale(1.1); }
        }

        .hero-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: 0.4s; filter: grayscale(0.5);
        }

        .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, #000 20%, transparent);
            padding: 30px 10px 10px; text-align: center;
        }

        .card-name {
            font-family: 'Orbitron'; font-size: 1.1rem;
            text-transform: uppercase; margin: 0;
            text-shadow: 0 2px 4px #000; letter-spacing: 1px;
        }

        .card-role-icon {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.8);
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 1px solid var(--primary);
            color: var(--primary); font-size: 0.7rem; z-index: 2;
        }

        /* --- DETALLE (MODAL) --- */
        #detail-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100; overflow-y: auto;
            animation: fadeIn 0.3s;
            backdrop-filter: blur(10px);
        }

        .detail-content {
            max-width: 1100px; margin: 20px auto;
            display: grid; grid-template-columns: 350px 1fr;
            gap: 30px; padding: 20px;
            position: relative;
        }

        .portrait-container { text-align: center; position: relative; }

        .main-portrait {
            width: 100%; border-radius: 10px;
            border: 2px solid var(--primary);
            box-shadow: 0 0 20px var(--primary);
            margin-bottom: 15px;
            max-height: 500px; object-fit: cover;
        }

        .sub-portrait {
            width: 70px; height: 70px; object-fit: cover;
            border: 1px solid var(--secondary);
            border-radius: 50%; cursor: pointer; transition: 0.3s; margin: 0 5px;
        }
        .sub-portrait:active { transform: scale(0.9); border-color: #fff; }

        .data-panel h2 {
            font-family: 'Orbitron'; font-size: 2.5rem; color: var(--primary); margin: 0;
            line-height: 1;
        }

        .role-badge {
            display: inline-block; padding: 4px 12px;
            background: var(--secondary); color: #fff;
            font-family: 'Orbitron'; font-size: 0.7rem;
            border-radius: 4px; margin-bottom: 15px; margin-top: 5px;
            box-shadow: 0 0 10px var(--secondary);
        }

        .lore-text {
            line-height: 1.6; font-size: 1rem; color: #ddd;
            border-left: 3px solid var(--danger); padding-left: 15px;
            background: linear-gradient(90deg, rgba(255,0,85,0.1), transparent);
            margin-bottom: 25px;
        }

        /* Stats Bars */
        .stat-row { display: flex; align-items: center; margin: 12px 0; }
        .stat-name { width: 90px; font-weight: bold; color: var(--primary); font-size: 0.9rem; }
        .stat-track { flex: 1; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .stat-fill { height: 100%; width: 0; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .fill-atk { background: linear-gradient(90deg, var(--danger), #ff5e95); }
        .fill-def { background: linear-gradient(90deg, #00aaff, #7ce0ff); }
        .fill-mag { background: linear-gradient(90deg, var(--secondary), #e084ff); }
        .fill-spd { background: linear-gradient(90deg, var(--gold), #ffe59e); }

        /* Skills */
        .skill-box {
            background: rgba(255,255,255,0.03); padding: 15px;
            border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; border-radius: 8px;
        }
        .skill-line { margin-bottom: 8px; font-size: 0.95rem; }
        .skill-title { color: var(--gold); font-family: 'Orbitron'; margin-right: 5px; }

        /* Armas */
        .weapons-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px; margin-top: 20px;
        }
        .weapon-item {
            background: rgba(0,0,0,0.4); padding: 10px;
            border: 1px solid #444; border-radius: 8px;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .weapon-item:active { background: rgba(0,243,255,0.2); border-color: var(--primary); }
        .weapon-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin-bottom: 5px; }
        .weapon-name { font-family:'Orbitron'; color:var(--primary); font-size:0.75rem; overflow: hidden; text-overflow: ellipsis; }

        .btn-close {
            position: fixed; top: 15px; right: 15px;
            background: var(--danger); color: white; border: none;
            width: 44px; height: 44px; font-size: 1.2rem;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--danger);
            cursor: pointer; z-index: 200;
            display: flex; align-items: center; justify-content: center;
        }

        /* Modal Img */
        .img-zoom {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            z-index: 300; justify-content: center; align-items: center;
            animation: fadeIn 0.2s;
        }
        .img-zoom img { max-width: 95%; max-height: 90%; border: 1px solid var(--primary); box-shadow: 0 0 30px rgba(0,243,255,0.2); }

        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 900px) {
            .detail-content { grid-template-columns: 1fr; margin-top: 50px; }
            .portrait-container { position: relative; top: 0; }
            #bg-video { display: none; } /* Ahorra batería y datos */
            body { background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%); }
            .filter-row { justify-content: flex-start; } /* Alinea al inicio para el scroll */
            .roster-grid { padding-bottom: 150px; } /* Espacio extra abajo */
            .main-portrait { height: auto; max-height: 350px; }
        }
    </style>
</head>
<body>

        const audioHover = document.getElementById('sfx-hover');
        const audioSelect = document.getElementById('sfx-select');
        const bgMusic = document.getElementById('bg-music-player');

        // --- INICIO INTERACTIVO (Evita bloqueo de audio en móvil) ---
        function iniciarExperiencia() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-overlay').style.display = 'none';
            }, 500);
            
            // Iniciar video si no es móvil
            if(!isMobile) {
                const vid = document.getElementById('bg-video');
                vid.play().catch(e => console.log("Video autoplay denied"));
            }
            audioEnabled = true;
            playSfx('select');
        }

        function playSfx(type) {
            if(!audioEnabled) return;
            // Clonamos el audio para permitir sonidos simultáneos rápidos
            if(type === 'hover') { 
                const sfx = audioHover.cloneNode(); sfx.volume=0.2; sfx.play().catch(()=>{}); 
            }
            if(type === 'select') { 
                const sfx = audioSelect.cloneNode(); sfx.volume=0.4; sfx.play().catch(()=>{}); 
            }
        }

        // --- SISTEMA DE PARTÍCULAS OPTIMIZADO ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * (isMobile ? 1.5 : 2); // Partículas más pequeñas en móvil
                this.speedX = (Math.random() * 0.5) - 0.25;
                this.speedY = (Math.random() * 0.5) - 0.25;
                this.color = 'rgba(0, 243, 255, 0.4)';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.x > canvas.width) this.x = 0;
                if(this.x < 0) this.x = canvas.width;
                if(this.y > canvas.height) this.y = 0;
                if(this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            // Reducir cantidad de partículas drásticamente en móvil para mejorar FPS y batería
            const count = isMobile ? 30 : 80;
            for(let i=0; i<count; i++) particlesArray.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            for(let i=0; i<particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // --- LÓGICA DE GRID ---
        const grid = document.getElementById('roster');

        function renderGrid(filtro="", rol="todos") {
            grid.innerHTML = "";
            let found = 0;
            Object.keys(heroes).forEach(key => {
                const h = heroes[key];
                if(h.nombre.toLowerCase().includes(filtro.toLowerCase()) && (rol==="todos" || h.rol===rol)) {
                    found++;
                    grid.innerHTML += `
                        <div class="hero-card" onclick="abrirDetalle('${key}')" onmouseenter="playSfx('hover')">
                            <div class="card-role-icon"><i class="fas ${h.icon}"></i></div>
                            <img src="${h.img1}" loading="lazy" alt="${h.nombre}">
                            <div class="card-info">
                                <h3 class="card-name">${h.nombre}</h3>
                            </div>
                        </div>
                    `;
                }
            });
            if(found === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:50px; opacity:0.5;">NO SE ENCONTRARON AGENTES</div>`;
            }
        }

        function filtrarGrid(val) { 
            renderGrid(val, document.querySelector('.btn.active').innerText.toLowerCase().trim());
        }
        
        function filtrarRol(rol) {
            playSfx('select');
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            // Limpiar input al cambiar rol para evitar confusiones
            const input = document.querySelector('.search-input');
            input.value = '';
            renderGrid("", rol);
        }

        function seleccionarAleatorio() {
            playSfx('select');
            const keys = Object.keys(heroes);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            abrirDetalle(randomKey);
        }

        // --- DETALLE ---
        function abrirDetalle(key) {
            playSfx('select');
            const h = heroes[key];
            const d = document.getElementById('detail-overlay');
            d.style.display = 'block';
            
            // Bloquear scroll del body
            document.body.style.overflow = 'hidden';

            // Textos
            document.getElementById('d-name').innerText = h.nombre;
            document.getElementById('d-role').innerText = h.rol.toUpperCase();
            document.getElementById('d-desc').innerText = h.desc;
            document.getElementById('d-passive').innerText = h.passive;
            document.getElementById('d-active').innerText = h.active;
            document.getElementById('d-weak').innerText = h.weak;
            
            // Imágenes
            document.getElementById('d-img-main').src = h.img1;
            // Aseguramos que existan antes de asignar
            document.getElementById('d-img-sub').src = h.img2 ? h.img2 : h.img1;
            document.getElementById('d-img-sub2').src = h.img1; // Reusa img1 como thumb

            // Animación Barras Stats
            setTimeout(() => {
                document.getElementById('bar-atk').style.width = h.stats.atk + '%';
                document.getElementById('bar-def').style.width = h.stats.def + '%';
                document.getElementById('bar-mag').style.width = h.stats.mag + '%';
                document.getElementById('bar-spd').style.width = h.stats.spd + '%';
            }, 100);

            // Armas
            const wContainer = document.getElementById('d-weapons');
            wContainer.innerHTML = '';
            h.weapons.forEach(w => {
                wContainer.innerHTML += `
                    <div class="weapon-item" onclick="zoomImg('${w.i}')" onmouseenter="playSfx('hover')">
                        <img src="${w.i}" loading="lazy">
                        <div class="weapon-name">${w.n}</div>
                    </div>
                `;
            });

            // Música
            if(h.music && audioEnabled) {
                bgMusic.src = h.music;
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => console.log("Audio block inside modal"));
            }
        }

        function cerrarDetalle() {
            playSfx('select');
            document.getElementById('detail-overlay').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restaurar scroll
            bgMusic.pause();
            bgMusic.currentTime = 0;
            // Resetear barras para que se animen la proxima vez
            ['atk','def','mag','spd'].forEach(s => document.getElementById('bar-'+s).style.width = '0%');
        }

        function cambiarMainImg(src) {
            document.getElementById('d-img-main').src = src;
            playSfx('hover');
        }

        function zoomImg(src) {
            document.getElementById('img-zoom').style.display = 'flex';
            document.getElementById('img-zoom-content').src = src;
        }

        // Inicio
        renderGrid();
    </script>
