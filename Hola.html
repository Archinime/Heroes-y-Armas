<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PROJECT: OMEGA - Ultimate Database v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --danger: #ff0055;
            --gold: #ffae00;
            --bg-dark: #050510;
            --card-bg: rgba(15, 20, 35, 0.8); /* Un poco más transparente */
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* --- FONDO ANIMADO MEJORADO (Más brillante) --- */
        #bg-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -5;
            /* MEJORA: Brillo aumentado de 0.4 a 0.7, contraste añadido */
            filter: brightness(0.7) grayscale(0.1) contrast(1.2);
            transition: opacity 0.5s;
        }
        
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -4; pointer-events: none;
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            /* MEJORA: Scanlines más sutiles (0.05 en vez de 0.1) para oscurecer menos */
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 2px);
            z-index: -3; pointer-events: none;
        }

        /* --- PANTALLA DE INICIO --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: opacity 0.5s;
        }
        .start-btn {
            border: 2px solid var(--primary); color: var(--primary);
            padding: 20px 40px; font-family: 'Orbitron'; font-size: 1.5rem;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 15px var(--primary);
            box-shadow: inset 0 0 20px rgba(0, 243, 255, 0.2);
            background: rgba(0, 243, 255, 0.05);
        }

        /* --- HEADER & CONTROLES --- */
        header {
            text-align: center; padding: 35px 20px 15px;
            animation: slideDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            text-transform: uppercase; margin: 0;
            background: linear-gradient(to bottom, #ffffff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            /* MEJORA: Sombra de texto más intensa */
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
            letter-spacing: 2px;
        }

        .subtitle {
            letter-spacing: 4px; color: var(--primary); 
            font-size: 0.9rem; margin-top: 8px; opacity: 0.9; font-weight: bold;
        }

        .controls-area {
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            margin-bottom: 25px; padding: 0 15px;
            position: sticky; top: 0; z-index: 50;
            /* MEJORA: Gradiente del header un poco más transparente arriba */
            background: linear-gradient(to bottom, rgba(5,5,16,0.9) 0%, rgba(5,5,16,0.98) 85%, transparent 100%);
            padding-top: 15px; padding-bottom: 25px;
            backdrop-filter: blur(5px);
        }

        .search-box { position: relative; width: 100%; max-width: 500px; }

        .search-input {
            width: 100%; padding: 12px 45px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(188, 19, 254, 0.5); /* Color secundario más sutil */
            border-radius: 30px;
            color: white; font-family: 'Orbitron'; font-size: 1rem;
            outline: none; transition: 0.4s;
            backdrop-filter: blur(5px);
        }
        .search-input:focus {
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.6), inset 0 0 10px rgba(188, 19, 254, 0.2); 
            border-color: var(--secondary);
            background: rgba(0,0,0,0.8);
        }
        .search-icon {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: var(--primary); transition: 0.3s;
        }
        .search-input:focus + .search-icon { text-shadow: 0 0 10px var(--primary); }


        /* Scroll horizontal para botones */
        .filter-wrapper {
            width: 100%; max-width: 1200px;
            overflow-x: auto; padding: 5px 0 10px;
            -webkit-overflow-scrolling: touch;
            /* MEJORA: Máscara para desvanecer los bordes del scroll */
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        
        .filter-wrapper::-webkit-scrollbar { height: 4px; }
        .filter-wrapper::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .filter-wrapper::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; box-shadow: 0 0 10px var(--primary); }

        .filter-row {
            display: flex; gap: 12px; justify-content: center;
            min-width: max-content; padding: 0 20px;
        }

        .btn {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: var(--primary);
            padding: 10px 24px;
            font-family: 'Orbitron'; font-size: 0.85rem; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s ease;
            white-space: nowrap;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
        }

        .btn:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .btn.active {
            background: var(--primary); color: #000;
            border-color: var(--primary);
            /* MEJORA: Brillo más intenso al estar activo */
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), inset 0 0 10px rgba(255,255,255,0.5);
            font-weight: 900;
            text-shadow: none;
        }
        
        .btn-random { border-color: rgba(255, 174, 0, 0.5); color: var(--gold); }
        .btn-random:hover { background: rgba(255, 174, 0, 0.2); box-shadow: 0 0 15px rgba(255, 174, 0, 0.4); }
        .btn-random.active { background: var(--gold); color: #000; box-shadow: 0 0 25px rgba(255, 174, 0, 0.6); }


        /* --- GRID MEJORADO --- */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1400px; margin: 0 auto; padding: 10px 20px 80px;
        }

        @media (min-width: 600px) {
            .roster-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 30px; }
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.15); /* Borde sutil azul */
            border-radius: 12px; overflow: hidden; position: relative;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            aspect-ratio: 3/4;
            /* MEJORA: Brillo base sutil para que destaquen del fondo oscuro */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 5px rgba(0, 243, 255, 0.1);
        }
        
        /* Efecto de línea de escaneo en el borde al hacer hover (Solo PC) */
        @media (hover: hover) {
            .hero-card::after {
                content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
                box-shadow: inset 0 0 0 2px var(--primary);
                opacity: 0; transition: opacity 0.3s; pointer-events: none;
                border-radius: 12px;
            }
            .hero-card:hover::after { opacity: 1; animation: borderFlash 1s infinite alternate; }

            .hero-card:hover {
                transform: translateY(-12px) scale(1.03);
                border-color: var(--primary);
                box-shadow: 0 15px 40px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.1);
                z-index: 10;
            }
            .hero-card:hover img { filter: grayscale(0) brightness(1.1); transform: scale(1.12); }
        }
        
        .hero-card:active { transform: scale(0.95); transition: 0.1s; }

        .hero-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: 0.5s; filter: grayscale(0.7) brightness(0.9); /* Un poco más oscuro por defecto para contraste */
        }

        .card-info {
            position: absolute; bottom: 0; left: 0; width: 100%;
            /* MEJORA: Gradiente más fuerte para leer mejor el texto */
            background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.7) 40%, transparent 100%);
            padding: 40px 10px 15px; text-align: center;
            border-bottom: 2px solid transparent; transition: 0.3s;
        }
        .hero-card:hover .card-info { border-bottom-color: var(--primary); }

        .card-name {
            font-family: 'Orbitron'; font-size: 1.2rem;
            text-transform: uppercase; margin: 0;
            /* MEJORA: Sombra de texto negra sólida para máxima legibilidad */
            text-shadow: 0 2px 8px rgba(0,0,0,1), 0 0 10px rgba(0, 243, 255, 0.5);
            letter-spacing: 1px; font-weight: 800;
        }

        .card-role-icon {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 5, 16, 0.9);
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; border: 1px solid var(--primary);
            color: var(--primary); font-size: 0.8rem; z-index: 2;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        /* --- DETALLE (MODAL) --- */
        #detail-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); /* Un poco menos opaco */
            z-index: 100; overflow-y: auto;
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(15px); /* Más blur */
        }

        .detail-content {
            max-width: 1100px; margin: 30px auto;
            display: grid; grid-template-columns: 380px 1fr;
            gap: 40px; padding: 30px; position: relative;
            background: radial-gradient(circle at top right, rgba(188, 19, 254, 0.1), transparent 40%),
                        linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .portrait-container { text-align: center; position: relative; }

        .main-portrait {
            width: 100%; border-radius: 15px;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4), inset 0 0 20px rgba(0, 243, 255, 0.2);
            margin-bottom: 20px;
            max-height: 550px; object-fit: cover;
            animation: portraitPulse 4s infinite alternate;
        }

        .sub-portrait {
            width: 75px; height: 75px; object-fit: cover;
            border: 2px solid rgba(188, 19, 254, 0.5);
            border-radius: 50%; cursor: pointer; transition: 0.3s; margin: 0 8px;
            filter: grayscale(0.5);
        }
        .sub-portrait:hover, .sub-portrait:active {
            transform: scale(1.1); border-color: var(--secondary);
            filter: grayscale(0); box-shadow: 0 0 15px var(--secondary);
        }

        .data-panel h2 {
            font-family: 'Orbitron'; font-size: 3rem; color: var(--primary); margin: 0;
            line-height: 1; text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .role-badge {
            display: inline-block; padding: 6px 16px;
            background: linear-gradient(45deg, var(--secondary), #9a0bd6); 
            color: #fff; font-family: 'Orbitron'; font-size: 0.8rem; letter-spacing: 1px;
            border-radius: 20px; margin-bottom: 20px; margin-top: 10px;
            box-shadow: 0 0 15px var(--secondary); font-weight: bold;
        }

        .lore-text {
            line-height: 1.7;
            /* MEJORA: Texto más claro y grande para leer mejor */
            font-size: 1.05rem; color: #eee; 
            border-left: 4px solid var(--danger); padding-left: 20px;
            background: linear-gradient(90deg, rgba(255,0,85,0.15) 0%, transparent 80%);
            margin-bottom: 30px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Stats Bars Mejoradas */
        .stat-row { display: flex; align-items: center; margin: 15px 0; }
        .stat-name { width: 100px; font-weight: 700; color: var(--primary); font-size: 0.95rem; letter-spacing: 1px; }
        .stat-track { flex: 1; height: 12px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; padding: 2px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
        .stat-fill { height: 100%; width: 0; border-radius: 4px; transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1); position: relative; overflow: hidden; }
        
        /* Efecto de brillo en las barras */
        .stat-fill::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: loadingShine 2s infinite;
        }
        
        .fill-atk { background: linear-gradient(90deg, var(--danger), #ff5e95); box-shadow: 0 0 10px var(--danger); }
        .fill-def { background: linear-gradient(90deg, #00aaff, #7ce0ff); box-shadow: 0 0 10px #00aaff; }
        .fill-mag { background: linear-gradient(90deg, var(--secondary), #e084ff); box-shadow: 0 0 10px var(--secondary); }
        .fill-spd { background: linear-gradient(90deg, var(--gold), #ffe59e); box-shadow: 0 0 10px var(--gold); }

        /* Skills y Armas */
        .skill-box {
            background: linear-gradient(to bottom right, rgba(255,255,255,0.03), rgba(0,0,0,0.2));
            padding: 20px; border: 1px solid rgba(255,255,255,0.08);
            margin-top: 25px; border-radius: 12px;
        }
        .skill-line { margin-bottom: 12px; font-size: 1rem; display: flex; align-items: baseline; }
        .skill-title { color: var(--gold); font-family: 'Orbitron'; margin-right: 10px; min-width: 80px; }

        .weapons-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 15px; margin-top: 25px;
        }
        .weapon-item {
            background: rgba(0, 5, 16, 0.6); padding: 12px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .weapon-item:hover {
            background: rgba(0, 243, 255, 0.1); border-color: var(--primary);
            transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }
        .weapon-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; border: 1px solid transparent; }
        .weapon-item:hover img { border-color: var(--primary); }
        .weapon-name { font-family:'Orbitron'; color:var(--primary); font-size:0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-close {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255, 0, 85, 0.8); color: white; border: none;
            width: 50px; height: 50px; font-size: 1.4rem;
            border-radius: 50%; border: 2px solid var(--danger);
            box-shadow: 0 0 20px var(--danger);
            cursor: pointer; z-index: 200; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-close:hover { background: var(--danger); transform: rotate(90deg) scale(1.1); }

        /* Modal Img */
        .img-zoom {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.96);
            z-index: 300; justify-content: center; align-items: center;
            animation: fadeIn 0.3s;
        }
        .img-zoom img { max-width: 95%; max-height: 90%; border: 2px solid var(--primary); box-shadow: 0 0 50px rgba(0, 243, 255, 0.3); border-radius: 8px; }

        /* Animaciones Varias */
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; box-shadow: 0 0 15px var(--primary); } 50% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 30px var(--primary); } 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 15px var(--primary); } }
        @keyframes loadingShine { 100% { left: 100%; } }
        @keyframes borderFlash { from { opacity: 0.6; } to { opacity: 1; } }
        @keyframes portraitPulse { 0% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.4); } 100% { box-shadow: 0 0 50px rgba(0, 243, 255, 0.7), 0 0 20px var(--secondary); } }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 900px) {
            .detail-content { grid-template-columns: 1fr; margin-top: 60px; padding: 20px; gap: 25px; }
            .portrait-container { top: 0; }
            #bg-video { display: none; } /* Ahorra batería y datos */
            /* MEJORA: Fondo móvil un poco más claro en el centro */
            body { background: radial-gradient(circle at center, #23233c 0%, #050510 100%); }
            .filter-row { justify-content: flex-start; padding: 0 15px; }
            .roster-grid { padding: 10px 15px 150px; gap: 15px; }
            .main-portrait { height: auto; max-height: 400px; }
            h1 { font-size: 2.2rem; }
            .data-panel h2 { font-size: 2.2rem; }
            .btn-close { top: 15px; right: 15px; width: 45px; height: 45px; }
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="iniciarExperiencia()">
        <h1 style="margin-bottom: 20px; text-align: center;">PROJECT: OMEGA<br><span style="font-size: 1rem; letter-spacing: 5px; color:var(--primary)">DATABASE V2.0</span></h1>
        <div class="start-btn">INICIAR SISTEMA</div>
        <p style="color: #aaa; margin-top: 25px; font-size: 0.9rem; text-align: center;"><i class="fas fa-fingerprint"></i> Toque para acceso biométrico y audio</p>
    </div>

    <audio id="sfx-hover" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="sfx-select" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="bg-music-player" loop></audio>

    <video id="bg-video" muted loop playsinline>
        <source src="https://www.dropbox.com/scl/fi/ckoormrj6fgd6zcw0xgwq/galaxia.mp4?rlkey=qs4g9k0rbylylu2hnqls0bf5n&st=fqp51h7j&raw=1" type="video/mp4">
    </video>
    <canvas id="particles"></canvas>
    <div class="scanlines"></div>

    <header>
        <h1>Project: OMEGA</h1>
        <div class="subtitle">// ULTIMATE HERO DATABASE //</div>
    </header>

    <div class="controls-area">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Buscar agente por nombre..." onkeyup="filtrarGrid(this.value)">
        </div>
        
        <div class="filter-wrapper">
            <div class="filter-row">
                <button class="btn active" onclick="filtrarRol('todos')">TODOS</button>
                <button class="btn" onclick="filtrarRol('guerrero')"><i class="fas fa-fist-raised"></i> GUERRERO</button>
                <button class="btn" onclick="filtrarRol('mago')"><i class="fas fa-hat-wizard"></i> MAGO</button>
                <button class="btn" onclick="filtrarRol('asesino')"><i class="fas fa-skull"></i> ASESINO</button>
                <button class="btn" onclick="filtrarRol('tanque')"><i class="fas fa-shield-alt"></i> TANQUE</button>
                <button class="btn" onclick="filtrarRol('soporte')"><i class="fas fa-medkit"></i> SOPORTE</button>
                <button class="btn btn-random" onclick="seleccionarAleatorio()"><i class="fas fa-dice"></i> RANDOM</button>
            </div>
        </div>
    </div>

    <div class="roster-grid" id="roster"></div>

    <div id="detail-overlay">
        <button class="btn-close" onclick="cerrarDetalle()"><i class="fas fa-times"></i></button>
        <div class="detail-content">
            <div class="portrait-container">
                <img src="" id="d-img-main" class="main-portrait" onclick="zoomImg(this.src)">
                <div>
                    <img src="" id="d-img-sub" class="sub-portrait" onclick="cambiarMainImg(this.src)">
                    <img src="" id="d-img-sub2" class="sub-portrait" onclick="cambiarMainImg(this.src)">
                </div>
                <div style="margin-top: 20px; font-family: 'Orbitron'; color: var(--primary); font-size: 0.85rem; display:flex; align-items:center; justify-content:center; gap:10px; text-shadow: 0 0 5px var(--primary);">
                    <i class="fas fa-headphones-alt fa-spin"></i> <span id="music-status">TRANSMISIÓN DE AUDIO ACTIVA</span>
                </div>
            </div>
            
            <div class="data-panel">
                <h2 id="d-name">NOMBRE</h2>
                <span id="d-role" class="role-badge">ROL</span>
                
                <p id="d-desc" class="lore-text">Descripción...</p>

                <h3 style="color:white; font-family:'Orbitron'; font-size:1.3rem; border-bottom:2px solid rgba(255,255,255,0.1); padding-bottom:10px; margin-bottom: 20px;">ESTADÍSTICAS DE COMBATE</h3>
                <div class="stat-row"><div class="stat-name">ATAQUE</div><div class="stat-track"><div id="bar-atk" class="stat-fill fill-atk"></div></div></div>
                <div class="stat-row"><div class="stat-name">DEFENSA</div><div class="stat-track"><div id="bar-def" class="stat-fill fill-def"></div></div></div>
                <div class="stat-row"><div class="stat-name">MAGIA</div><div class="stat-track"><div id="bar-mag" class="stat-fill fill-mag"></div></div></div>
                <div class="stat-row"><div class="stat-name">VELOCIDAD</div><div class="stat-track"><div id="bar-spd" class="stat-fill fill-spd"></div></div></div>

                <div class="skill-box">
                    <div class="skill-line"><strong class="skill-title"><i class="fas fa-dna"></i> PASIVA:</strong> <span id="d-passive"></span></div>

        const audioHover = document.getElementById('sfx-hover');
        const audioSelect = document.getElementById('sfx-select');
        const bgMusic = document.getElementById('bg-music-player');

        // --- INICIO INTERACTIVO ---
        function iniciarExperiencia() {
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-overlay').style.display = 'none';
            }, 500);
            
            if(!isMobile) {
                const vid = document.getElementById('bg-video');
                vid.play().catch(e => console.log("Video autoplay denied"));
            }
            audioEnabled = true;
            playSfx('select');
        }

        function playSfx(type) {
            if(!audioEnabled) return;
            if(type === 'hover') { 
                const sfx = audioHover.cloneNode(); sfx.volume=0.3; sfx.play().catch(()=>{}); 
            }
            if(type === 'select') { 
                const sfx = audioSelect.cloneNode(); sfx.volume=0.5; sfx.play().catch(()=>{}); 
            }
        }

        // --- SISTEMA DE PARTÍCULAS ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * (isMobile ? 1.5 : 2.5); 
                this.speedX = (Math.random() * 0.4) - 0.2;
                this.speedY = (Math.random() * 0.4) - 0.2;
                this.color = `rgba(0, 243, 255, ${Math.random() * 0.3 + 0.1})`; // Opacidad variable
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.x > canvas.width) this.x = 0;
                if(this.x < 0) this.x = canvas.width;
                if(this.y > canvas.height) this.y = 0;
                if(this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            const count = isMobile ? 35 : 90;
            for(let i=0; i<count; i++) particlesArray.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            for(let i=0; i<particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // --- LÓGICA DE GRID ---
        const grid = document.getElementById('roster');

        function renderGrid(filtro="", rol="todos") {
            grid.innerHTML = "";
            let found = 0;
            Object.keys(heroes).forEach(key => {
                const h = heroes[key];
                if(h.nombre.toLowerCase().includes(filtro.toLowerCase()) && (rol==="todos" || h.rol===rol)) {
                    found++;
                    grid.innerHTML += `
                        <div class="hero-card" onclick="abrirDetalle('${key}')" onmouseenter="playSfx('hover')">
                            <div class="card-role-icon"><i class="fas ${h.icon}"></i></div>
                            <img src="${h.img1}" loading="lazy" alt="${h.nombre}">
                            <div class="card-info">
                                <h3 class="card-name">${h.nombre}</h3>
                            </div>
                        </div>
                    `;
                }
            });
            if(found === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:60px; opacity:0.7; font-family:'Orbitron'; color:var(--primary); letter-spacing:2px;"><i class="fas fa-search-minus" style="font-size:2rem; margin-bottom:15px; display:block;"></i>NO SE ENCONTRARON AGENTES BAJO ESE CRITERIO</div>`;
            }
        }

        function filtrarGrid(val) { 
            renderGrid(val, document.querySelector('.btn.active').innerText.toLowerCase().trim());
        }
        
        function filtrarRol(rol) {
            playSfx('select');
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            const input = document.querySelector('.search-input');
            input.value = '';
            renderGrid("", rol);
        }

        function seleccionarAleatorio() {
            playSfx('select');
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.btn-random').classList.add('active');
            const keys = Object.keys(heroes);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            abrirDetalle(randomKey);
        }

        // --- DETALLE ---
        function abrirDetalle(key) {
            playSfx('select');
            const h = heroes[key];
            const d = document.getElementById('detail-overlay');
            d.style.display = 'block';
            document.body.style.overflow = 'hidden';

            // Textos mejorados
            document.getElementById('d-name').innerText = h.nombre;
            document.getElementById('d-role').innerText = h.rol.toUpperCase();
            document.getElementById('d-role').innerHTML = `<i class="fas ${h.icon}"></i> ${h.rol.toUpperCase()}`;
            document.getElementById('d-desc').innerText = h.desc;
            document.getElementById('d-passive').innerText = h.passive;
            document.getElementById('d-active').innerText = h.active;
            document.getElementById('d-weak').innerText = h.weak;
            
            // Imágenes
            document.getElementById('d-img-main').src = h.img1;
            document.getElementById('d-img-sub').src = h.img2 ? h.img2 : h.img1;
            document.getElementById('d-img-sub2').src = h.img1;

            // Animación Barras Stats con ligero retraso
            setTimeout(() => {
                document.getElementById('bar-atk').style.width = h.stats.atk + '%';
                document.getElementById('bar-def').style.width = h.stats.def + '%';
                document.getElementById('bar-mag').style.width = h.stats.mag + '%';
                document.getElementById('bar-spd').style.width = h.stats.spd + '%';
            }, 200);

            // Armas
            const wContainer = document.getElementById('d-weapons');
            wContainer.innerHTML = '';
            h.weapons.forEach(w => {
                wContainer.innerHTML += `
                    <div class="weapon-item" onclick="zoomImg('${w.i}')" onmouseenter="playSfx('hover')">
                        <img src="${w.i}" loading="lazy">
                        <div class="weapon-name">${w.n}</div>
                    </div>
                `;
            });

            // Música
            if(h.music && audioEnabled) {
                bgMusic.src = h.music;
                bgMusic.volume = 0.35;
                bgMusic.play().catch(e => console.log("Audio block"));
            }
        }

        function cerrarDetalle() {
            playSfx('select');
            document.getElementById('detail-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
            bgMusic.pause();
            bgMusic.currentTime = 0;
            ['atk','def','mag','spd'].forEach(s => document.getElementById('bar-'+s).style.width = '0%');
        }

        function cambiarMainImg(src) {
            document.getElementById('d-img-main').src = src;
            playSfx('hover');
        }

        function zoomImg(src) {
            document.getElementById('img-zoom').style.display = 'flex';
            document.getElementById('img-zoom-content').src = src;
        }

        // Inicio
        renderGrid();
    </script>
</body>
</html>
